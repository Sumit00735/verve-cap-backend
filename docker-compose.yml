services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: verve
      POSTGRES_PASSWORD: verve
      POSTGRES_DB: verve
    volumes:
      - verve_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: verve
      MINIO_ROOT_PASSWORD: verveverve
    volumes:
      - verve_minio:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'

volumes:
  verve_pg:
  verve_minio: