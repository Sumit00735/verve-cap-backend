services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: dealdesk
      POSTGRES_PASSWORD: dealdesk
      POSTGRES_DB: dealdesk
    volumes:
      - dealdesk_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'

  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data --console-address ":9001"
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: dealdesk
      MINIO_ROOT_PASSWORD: dealdeskdesk
    volumes:
      - dealdesk_minio:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'

volumes:
  dealdesk_pg:
  dealdesk_minio: