openapi: 3.1.0
info:
  title: DealDesk API
  version: 1.0.0-beta
  description: Phase 1 auth and admin modules.
paths:
  /health:
    get:
      summary: Liveness
      responses:
        '200':
          description: OK
  /ready:
    get:
      summary: Readiness
      responses:
        '200':
          description: OK
        '503':
          description: Unavailable
  /api/v1/auth/register/verification-code:
    post:
      summary: Send registration email verification code
      responses:
        '200':
          description: Code queued
  /api/v1/auth/register/verify-code:
    post:
      summary: Confirm registration verification code
      responses:
        '200':
          description: Verified
  /api/v1/auth/register:
    post:
      summary: Register account
      responses:
        '200':
          description: Pending approval
        '409':
          description: duplicate_email
  /api/v1/auth/login:
    post:
      summary: Sign in
      responses:
        '200':
          description: Session cookies set
  /api/v1/auth/logout:
    post:
      summary: Sign out
  /api/v1/auth/refresh:
    post:
      summary: Rotate session
  /api/v1/auth/me:
    get:
      summary: Current user
  /api/v1/profile:
    get:
      summary: Current profile
    patch:
      summary: Update allowlisted profile fields
  /api/v1/companies:
    get:
      summary: List or search companies
    post:
      summary: Create company record
  /api/v1/companies/{id}:
    get:
      summary: Get company
    patch:
      summary: Update company
  /api/v1/auth/forgot-password:
    post:
      summary: Request password reset
  /api/v1/auth/reset-password:
    post:
      summary: Complete password reset
  /api/v1/admin/users:
    get:
      summary: List users
  /api/v1/admin/users/{id}/status:
    patch:
      summary: Update user status
  /api/v1/admin/users/{id}/role:
    patch:
      summary: Set user role
  /api/v1/admin/dashboard:
    get:
      summary: Admin counts
  /api/v1/admin/activity:
    get:
      summary: Activity log
  /api/v1/admin/emails:
    get:
      summary: Email delivery log
components: {}